data_contract:
  version: 1.0.0
  source: customers.csv
  format: CSV
  schema:
    - column: customer_id
      type: integer
      nullable: false
      description: Unique customer identifier (primary key)
    - column: name
      type: string
      nullable: true
      description: Customer's full name
    - column: email
      type: string
      nullable: true
      description: Customer's email address
    - column: phone
      type: string
      nullable: true
      description: Customer's phone number
    - column: city
      type: string
      nullable: true
      description: Customer's city
  quality_checks:
    - type: not_null
      column: customer_id
    - type: unique
      column: customer_id
  delivery:
    method: file_copy
    destination: PostgreSQL
    schedule: manual